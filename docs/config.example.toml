# spectra config example

prefix = "C-j"
# When true, prefix mode stays active after executing a command.
# Press the prefix key again or ESC to exit. (default: true)
prefix_sticky = true
session_name = "main"
initial_command = "echo ready"
editor = "vim"

[shell]
suppress_prompt_eol_marker = true
# Working directory for new panes and windows:
#   "follow"  - inherit the focused pane's cwd (default)
#   "home"    - the user's home directory
#   "current" - the session's startup directory
#   any other value is used as a fixed path, e.g. "/srv/projects"
new_cwd = "follow"

[mouse]
enabled = false

[terminal]
# tmux-compatible pass-through (DCS tmux;...ST) to the outer terminal.
allow_passthrough = true
# Scrollback kept per pane, in visual rows (soft-wrapped lines count once
# per row). 0 disables scrollback. (default: 10000)
scrollback_lines = 10000

[pane]
# Seconds a closed pane is kept alive (process still running) so
# `restore-pane` (prefix u) can undo the close. 0 disables it. (default: 10)
undo_close_seconds = 10
# Raw output bytes retained per pane and replayed across a live server
# handoff (`spectra server-handoff` / automatic after `spectra --update`).
# Scrollback beyond this tail does not survive a handoff. (default: 262144)
handoff_replay_bytes = 262144

[sidebar]
# Show the window-tree sidebar by default on session start. (default: true)
default_open = true
# Row formats with {token} placeholders, like [status].format.
# "\n" splits an entry into multiple sidebar lines.
# Session header tokens: {session_index} {session_name} {session_id} {window_count}
# Window row tokens: {window_label} {window_index} {window_name} {window_id}
#   {pane_count} {agent} {session_index} {session_name}
# {window_label} is the classic default: `w2`, or `w2:name` when named.
session_format = "{session_name}"
window_format = "{window_label}"

[status]
format = "session {session_index}/{session_count}:{session_name} | window {window_index}/{window_count} | pane {pane_index}/{pane_count} | prefix {prefix}{lock}{zoom}{sync}{mouse}{message}"
background = "#2E3440"
foreground = "#D8DEE9"

[ime]
# CJK / IME affordances.
# macOS IMEs draw their candidate window at the host terminal's real cursor.
# Guests that hide the cursor and draw their own (Claude Code, fzf, ...)
# would strand the candidate window; this re-shows the host cursor at the
# guest cursor cell so the popup anchors correctly. (default: false)
reveal_hidden_cursor = false
# Cursor shape while a hidden cursor is revealed: "block" | "bar" |
# "underline". Omit to keep the guest's shape.
#cursor_shape = "bar"
# Limit the reveal to panes running these detected agents (manifest names,
# e.g. "claude"). Empty = every pane.
agents = []
# With a CJK IME active, the key after the prefix can be eaten by the IME.
# These commands run when the pending-prefix state starts/ends, e.g. with
# im-select (macOS) or fcitx5-remote/ibus (Linux). SPECTRA_PREFIX_PENDING is
# 1 or 0 in the command's environment.
#prefix_ascii_command = "im-select com.apple.keylayout.ABC"
#prefix_restore_command = "im-select com.apple.inputmethod.Kotoeri.RomajiTyping.Japanese"

[hooks]
session_created = ""
session_killed = ""
window_created = ""
pane_split = ""
pane_closed = ""
pane_restored = ""
config_reloaded = ""

[prefix_bindings]
"|" = "split-vertical"
"\"" = "split-horizontal"
Left = "focus-left"
Down = "focus-down"
Up = "focus-up"
Right = "focus-right"
w = "window-tree"
Tab = "window-tree"
W = "peek-all-windows"
n = "new-session"
c = "new-window"
r = "reload-config"
z = "toggle-zoom"
S = "synchronize-panes"
d = "detach-client"
o = "focus-next-pane"
p = "command-palette"
O = "focus-prev-pane"
"[" = "enter-cursor-mode"
# Stage the OS clipboard image to a temp file and paste the quoted path
# into the focused pane (works over --remote; the image is read on the
# client machine and staged server-side).
v = "paste-image"
"C-Left" = "resize-left"
"C-Down" = "resize-down"
"C-Up" = "resize-up"
"C-Right" = "resize-right"
# Sticky resize mode: arrows/hjkl keep resizing until Esc/Enter/q.
R = "resize-mode"
"{" = "swap-prev-window"
"}" = "swap-next-window"
# Directional pane swap (shape-preserving); Shift+arrows are bound too.
H = "swap-pane-left"
J = "swap-pane-down"
K = "swap-pane-up"
L = "swap-pane-right"
# Move the focused pane out into a new window (tmux break-pane).
"!" = "break-pane"
# Graft the focused pane into window N: "move-pane-to-window-<n>" (unbound
# by default).
"$" = "rename-session"
"C-s" = "save-layout"
l = "write-log"
P = "write-scrollback"
# e = "open-current-pane-buffer-in-editor"
"(" = "prev-session"
")" = "next-session"
s = "window-tree"

[global_bindings]
# Cmd+C (super+c) copies the mouse drag selection; bound by default.
# Needs a terminal that reports super-modified keys via the kitty keyboard
# protocol and passes cmd+c through when it has no selection of its own
# (e.g. Ghostty). Works over --remote too (delivered as OSC 52).
# Modifier spellings: cmd+c / super+c / D-c. Disable with "none".
#"cmd+c" = "copy-selection"
# Alt+Arrow for pane focus without prefix.
# macOS: most terminals intercept Alt+Left/Right. For Ghostty, add to config:
#   keybind = alt+left=text:\x1b[1;3D
#   keybind = alt+right=text:\x1b[1;3C
"M-Left" = "focus-left"
"M-Down" = "focus-down"
"M-Up" = "focus-up"
"M-Right" = "focus-right"
"C-w" = "window-tree"
